<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Books — Urdaneta City Library</title>
<link rel="stylesheet" href="/library.css">
</head>
<body>

<nav class="lib-navbar">
  <a href="/" class="logo">📚 Urdaneta City Library</a>
  <div class="nav-links">
    <a href="/librarian.html">Dashboard</a>
    <span class="user-info" id="userDisplay"></span>
  </div>
</nav>

<div class="lib-page">
  <div class="lib-page-header">
    <h1>📚 Manage Books</h1>
    <div class="breadcrumb"><a href="/librarian.html">Librarian Dashboard</a> → Manage Books</div>
  </div>

  <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;">
    <button class="lib-btn lib-btn-success" onclick="openModal()">+ Add New Book</button>
    <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.9rem;color:var(--text-light);cursor:pointer;">
      <input type="checkbox" id="showDeletedToggle" onchange="fetchBooks()"> Show Archived Books
    </label>
  </div>

  <div class="lib-table-wrapper">
    <table class="lib-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Copies (Avail / Total)</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="booksTable"></tbody>
    </table>
  </div>
</div>

<!-- Modal for Add/Edit Book -->
<div id="bookModal" class="lib-modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="lib-modal">
    <button class="lib-modal-close" onclick="closeModal()">&times;</button>
    <h2 id="modalTitle">Add Book</h2>
    <input type="hidden" id="bookId">
    <div class="lib-form-group">
      <label>Title</label>
      <input type="text" id="title" class="lib-input" placeholder="Book title">
    </div>
    <div class="lib-form-group">
      <label>Author</label>
      <input type="text" id="author" class="lib-input" placeholder="Author name">
    </div>
    <div class="lib-form-group">
      <label>Description</label>
      <textarea id="description" class="lib-input" rows="3" placeholder="Short description"></textarea>
    </div>
    <div class="lib-form-group">
      <label>Total Copies</label>
      <input type="number" id="totalCopies" class="lib-input" min="1" value="1">
    </div>
    <div style="display:flex;gap:0.75rem;">
      <button class="lib-btn lib-btn-primary" onclick="saveBook()" style="flex:1">Save</button>
      <button class="lib-btn lib-btn-outline" onclick="closeModal()" style="flex:1">Cancel</button>
    </div>
  </div>
</div>

<!-- Modal for Viewing Copies -->
<div id="copiesModal" class="lib-modal-overlay" onclick="if(event.target===this)closeCopiesModal()">
  <div class="lib-modal" style="max-width:600px;">
    <button class="lib-modal-close" onclick="closeCopiesModal()">&times;</button>
    <h2 id="copiesTitle">Book Copies</h2>
    <div class="lib-table-wrapper" style="margin-top:1rem;">
      <table class="lib-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Accession No.</th>
            <th>Status</th>
            <th>Condition</th>
          </tr>
        </thead>
        <tbody id="copiesBody"></tbody>
      </table>
    </div>
  </div>
</div>

<footer class="lib-footer">
  <p>&copy; 2026 Urdaneta City Library</p>
</footer>

<script>
const token = localStorage.getItem("token");
if (!token) window.location.href = "/login.html";

const username = localStorage.getItem("username");
document.getElementById("userDisplay").textContent = username ? `👤 ${username}` : "";

async function fetchBooks() {
    const showDeleted = document.getElementById("showDeletedToggle").checked;
    let url = "/api/books";
    if (showDeleted) url += "?includeDeleted=true";
    
    const res = await fetch(url);
    const books = await res.json();
    const tbody = document.getElementById("booksTable");
    tbody.innerHTML = "";
    
    books.forEach(book => {
        const isDeleted = book.isDeleted;
        tbody.innerHTML += `
            <tr style="${isDeleted ? 'opacity:0.5;' : ''}">
                <td><strong>${book.title}</strong></td>
                <td>${book.author}</td>
                <td>
                  <span class="lib-badge ${book.availableCopies > 0 ? 'lib-badge-success' : 'lib-badge-danger'}">
                    ${book.availableCopies}
                  </span> / ${book.totalCopies}
                  <button class="lib-btn lib-btn-sm" style="margin-left:0.5rem;background:var(--primary-light);color:#fff;font-size:0.7rem;" onclick="viewCopies('${book._id}', '${book.title.replace(/'/g,"\\'")}')">View Copies</button>
                </td>
                <td>
                  ${isDeleted 
                    ? '<span class="lib-badge lib-badge-danger">Archived</span>' 
                    : '<span class="lib-badge lib-badge-success">Active</span>'}
                </td>
                <td>
                    ${isDeleted 
                      ? `<button class="lib-btn lib-btn-success lib-btn-sm" onclick="restoreBook('${book._id}')">Restore</button>`
                      : `
                        <button class="lib-btn lib-btn-primary lib-btn-sm" onclick="editBook('${book._id}', '${book.title.replace(/'/g,"\\'")}', '${book.author.replace(/'/g,"\\'")}', '${(book.description||'').replace(/'/g,"\\'")}', ${book.totalCopies})">Edit</button>
                        <button class="lib-btn lib-btn-danger lib-btn-sm" onclick="deleteBook('${book._id}')">Archive</button>
                      `}
                </td>
            </tr>
        `;
    });

    if(!tbody.innerHTML) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:2rem;">No books found.</td></tr>';
    }
}

function openModal() {
    document.getElementById("bookModal").classList.add("active");
    document.getElementById("modalTitle").innerText = "Add Book";
    document.getElementById("bookId").value = "";
    document.getElementById("title").value = "";
    document.getElementById("author").value = "";
    document.getElementById("description").value = "";
    document.getElementById("totalCopies").value = "1";
}

function editBook(id, title, author, desc, copies) {
    document.getElementById("bookModal").classList.add("active");
    document.getElementById("modalTitle").innerText = "Edit Book";
    document.getElementById("bookId").value = id;
    document.getElementById("title").value = title;
    document.getElementById("author").value = author;
    document.getElementById("description").value = desc;
    document.getElementById("totalCopies").value = copies;
}

function closeModal() {
    document.getElementById("bookModal").classList.remove("active");
}

async function saveBook() {
    const id = document.getElementById("bookId").value;
    const title = document.getElementById("title").value;
    const author = document.getElementById("author").value;
    const description = document.getElementById("description").value;
    const totalCopies = document.getElementById("totalCopies").value;

    const method = id ? "PUT" : "POST";
    const url = id ? "/api/books/" + id : "/api/books";

    const res = await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ title, author, description, totalCopies: parseInt(totalCopies) })
    });

    if (res.ok) { alert("Book saved!"); closeModal(); fetchBooks(); }
    else { const data = await res.json(); alert(data.message || "Error saving book"); }
}

async function deleteBook(id) {
    if(!confirm("Archive this book? (It can be restored later)")) return;
    const res = await fetch("/api/books/" + id, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + token }
    });
    if (res.ok) { alert("Book archived."); fetchBooks(); }
    else alert("Failed to archive book");
}

async function restoreBook(id) {
    const res = await fetch("/api/books/" + id + "/restore", {
        method: "PUT",
        headers: { "Authorization": "Bearer " + token }
    });
    if (res.ok) { alert("Book restored!"); fetchBooks(); }
    else alert("Failed to restore book");
}

async function viewCopies(bookId, bookTitle) {
    document.getElementById("copiesTitle").textContent = "Copies: " + bookTitle;
    document.getElementById("copiesModal").classList.add("active");
    
    const res = await fetch("/api/books/" + bookId + "/copies", {
        headers: { "Authorization": "Bearer " + token }
    });
    const copies = await res.json();
    const tbody = document.getElementById("copiesBody");
    tbody.innerHTML = "";

    if (copies.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:1rem;">No copy records found.</td></tr>';
        return;
    }

    copies.forEach(copy => {
        let statusBadge = '';
        switch(copy.status) {
            case 'AVAILABLE': statusBadge = '<span class="lib-badge lib-badge-success">Available</span>'; break;
            case 'BORROWED': statusBadge = '<span class="lib-badge lib-badge-info">Borrowed</span>'; break;
            case 'LOST': statusBadge = '<span class="lib-badge lib-badge-danger">Lost</span>'; break;
            case 'DAMAGED': statusBadge = '<span class="lib-badge lib-badge-warning">Damaged</span>'; break;
            case 'MAINTENANCE': statusBadge = '<span class="lib-badge lib-badge-neutral">Maintenance</span>'; break;
            default: statusBadge = `<span class="lib-badge lib-badge-neutral">${copy.status}</span>`;
        }

        let conditionBadge = '';
        switch(copy.condition) {
            case 'NEW': conditionBadge = '<span class="lib-badge lib-badge-success">New</span>'; break;
            case 'GOOD': conditionBadge = '<span class="lib-badge lib-badge-info">Good</span>'; break;
            case 'FAIR': conditionBadge = '<span class="lib-badge lib-badge-warning">Fair</span>'; break;
            case 'POOR': conditionBadge = '<span class="lib-badge lib-badge-danger">Poor</span>'; break;
            default: conditionBadge = `<span class="lib-badge lib-badge-neutral">${copy.condition}</span>`;
        }

        tbody.innerHTML += `
          <tr>
            <td>${copy.copyNumber}</td>
            <td><code>${copy.accessionNo}</code></td>
            <td>${statusBadge}</td>
            <td>${conditionBadge}</td>
          </tr>
        `;
    });
}

function closeCopiesModal() {
    document.getElementById("copiesModal").classList.remove("active");
}

fetchBooks();
</script>

</body>
</html>
