<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Librarian Dashboard — Urdaneta City Library</title>
<link rel="stylesheet" href="/library.css">
</head>
<body>

<nav class="lib-navbar">
  <a href="/" class="logo">📚 Urdaneta City Library</a>
  <div class="nav-links">
    <span class="user-info" id="userDisplay"></span>
    <a href="#" id="logoutBtn">Logout</a>
  </div>
</nav>

<div class="lib-page">
  <div class="lib-page-header">
    <h1>📖 Librarian Dashboard</h1>
    <div class="breadcrumb">Manage books and assist members</div>
  </div>

  <div class="lib-dash-grid">
    <div class="lib-dash-card" onclick="window.location.href='/manage-books.html'">
      <div class="card-icon">📚</div>
      <h2>Manage Books</h2>
      <p>Add, edit, or remove books from the catalog</p>
    </div>

    <div class="lib-dash-card" onclick="window.location.href='/issue-book.html'">
      <div class="card-icon">📤</div>
      <h2>Issue Book</h2>
      <p>Issue books directly to members</p>
    </div>

    <div class="lib-dash-card" onclick="window.location.href='/active-loans.html'">
      <div class="card-icon">📑</div>
      <h2>Active Loans</h2>
      <p>View borrowed books, returns, and renewals</p>
    </div>
  </div>
</div>

<footer class="lib-footer">
  <p>&copy; 2026 Urdaneta City Library</p>
</footer>

<script>
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");
const username = localStorage.getItem("username");

if (!token) {
  alert("You must log in first!");
  window.location.href = "/login.html";
}
if (role && role !== "LIBRARIAN" && role !== "ADMIN") {
  alert("This page is for Librarians only.");
  window.location.href = "/member.html";
}

document.getElementById("userDisplay").textContent = username ? `👤 ${username} (${role})` : "";

document.getElementById("logoutBtn").addEventListener("click", (e) => {
  e.preventDefault();
  localStorage.removeItem("token");
  localStorage.removeItem("role");
  localStorage.removeItem("username");
  window.location.href = "/login.html";
});
</script>

</body>
</html>
