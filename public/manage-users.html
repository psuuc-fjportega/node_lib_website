<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users — Urdaneta City Library</title>
<link rel="stylesheet" href="/library.css">
</head>
<body>

<nav class="lib-navbar">
  <a href="/" class="logo">📚 Urdaneta City Library</a>
  <div class="nav-links">
    <a href="/admin.html">Dashboard</a>
    <span class="user-info" id="userDisplay"></span>
  </div>
</nav>

<div class="lib-page">
  <div class="lib-page-header">
    <h1>👥 Manage Users</h1>
    <div class="breadcrumb"><a href="/admin.html">Admin Dashboard</a> → Manage Users</div>
  </div>

  <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;">
    <button class="lib-btn lib-btn-success" onclick="document.getElementById('addUserModal').classList.add('active')">
      + Add User
    </button>
    <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.9rem;color:var(--text-light);cursor:pointer;">
      <input type="checkbox" id="showDeletedToggle" onchange="fetchUsers()"> Show Archived Users
    </label>
  </div>

  <div class="lib-table-wrapper">
    <table class="lib-table">
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="userTable"></tbody>
    </table>
  </div>
</div>

<!-- Add User Modal -->
<div id="addUserModal" class="lib-modal-overlay" onclick="if(event.target===this)this.classList.remove('active')">
  <div class="lib-modal">
    <button class="lib-modal-close" onclick="document.getElementById('addUserModal').classList.remove('active')">&times;</button>
    <h2>Add New User</h2>
    <div class="lib-form-group">
      <label>Username</label>
      <input type="text" id="newUsername" class="lib-input" placeholder="Enter username">
    </div>
    <div class="lib-form-group">
      <label>Password</label>
      <input type="password" id="newPassword" class="lib-input" placeholder="Enter password">
    </div>
    <div class="lib-form-group">
      <label>Role</label>
      <select id="newRole" class="lib-input">
        <option value="MEMBER">Member</option>
        <option value="LIBRARIAN">Librarian</option>
        <option value="ADMIN">Admin</option>
      </select>
    </div>
    <button class="lib-btn lib-btn-primary" onclick="addUser()" style="width:100%">Create User</button>
  </div>
</div>

<footer class="lib-footer">
  <p>&copy; 2026 Urdaneta City Library</p>
</footer>

<script>
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");
const username = localStorage.getItem("username");

if (!token || role !== "ADMIN") {
  alert("Access denied");
  window.location.href = "/login.html";
}

document.getElementById("userDisplay").textContent = username ? `👤 ${username}` : "";

function getCurrentUserIdFromToken() {
  try {
    const payload = JSON.parse(atob(token.split('.')[1]));
    return payload.userId || payload.id || payload._id;
  } catch {
    return null;
  }
}

async function safeJson(res) {
  const raw = await res.text();
  try { return raw ? JSON.parse(raw) : {}; } catch { return { raw }; }
}

fetchUsers();

async function fetchUsers() {
  try {
    const showDeleted = document.getElementById("showDeletedToggle").checked;
    let url = "/api/users";
    if (showDeleted) url += "?includeDeleted=true";

    const res = await fetch(url, {
      headers: { "Authorization": "Bearer " + token }
    });

    const data = await safeJson(res);
    if (!res.ok) { alert(data.message || data.error || data.raw || "Failed to fetch users"); return; }

    const table = document.getElementById("userTable");
    table.innerHTML = "";

    if (!Array.isArray(data)) { alert("Users data is not an array!"); return; }

    const currentUserId = getCurrentUserIdFromToken();

    data.forEach(user => {
      const isOtherAdmin = user.role === 'ADMIN' && user._id !== currentUserId;
      const isDeleted = !!user.isDeleted;

      // Build status badges
      let statusBadges = '';
      if (isDeleted) {
        statusBadges = '<span class="lib-badge lib-badge-danger">Archived</span>';
      } else if (user.isActive === false) {
        statusBadges = '<span class="lib-badge lib-badge-warning">Disabled</span>';
      } else {
        statusBadges = '<span class="lib-badge lib-badge-success">Active</span>';
      }

      // Build action buttons
      let actions = '';
      if (isDeleted) {
        actions = `<button class="lib-btn lib-btn-success lib-btn-sm" onclick="restoreUser('${user._id}')">Restore</button>`;
      } else if (isOtherAdmin) {
        actions = '<span class="lib-badge lib-badge-neutral">Protected</span>';
      } else {
       actions = `

  <button
  id="btn-update-${user._id}"
  class="lib-btn lib-btn-success lib-btn-sm"
  onclick="editUser('${user._id}')"
  ${user.isActive === false ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>
  Update
</button>

  <button 
    class="lib-btn lib-btn-warning lib-btn-sm" 
    onclick="toggleUserStatus('${user._id}')">
    ${user.isActive === false ? 'Enable' : 'Disable'}
  </button>

  <button 
    class="lib-btn lib-btn-danger lib-btn-sm" 
    onclick="deleteUser('${user._id}')">
    Archive
  </button>
`;

      }

      // store status in DOM so updateUser() can read it
      const statusValue = isDeleted ? "ARCHIVED" : (user.isActive === false ? "DISABLED" : "ACTIVE");

      table.innerHTML += `
        <tr data-status="${statusValue}" style="${isDeleted ? 'opacity:0.5;' : (user.isActive === false ? 'opacity:0.7;' : '')}">
          <td>
            <input type="text" id="username-${user._id}" value="${user.username}" class="lib-input" style="padding:0.4rem 0.6rem;" ${isOtherAdmin || isDeleted ? 'disabled' : 'disabled'} />
          </td>
          <td>
            <select id="role-${user._id}" class="lib-input" style="padding:0.4rem 0.6rem;" ${isOtherAdmin || isDeleted ? 'disabled' : 'disabled'}>
              <option value="MEMBER" ${user.role === 'MEMBER' ? 'selected' : ''}>Member</option>
              <option value="LIBRARIAN" ${user.role === 'LIBRARIAN' ? 'selected' : ''}>Librarian</option>
              <option value="ADMIN" ${user.role === 'ADMIN' ? 'selected' : ''}>Admin</option>
            </select>
          </td>
          <td>${statusBadges}</td>
          <td>${actions}</td>
        </tr>
      `;
    });

    if (!data.length) {
      table.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:2rem;">No users found.</td></tr>';
    }
  } catch (error) {
    console.error("FETCH ERROR:", error);
    alert("Something crashed while fetching users.");
  }
}

async function addUser() {
  const uname = document.getElementById("newUsername").value;
  const pass = document.getElementById("newPassword").value;
  const r = document.getElementById("newRole").value;

  if(!uname || !pass) return alert("Please fill all fields");

  const res = await fetch("/api/users/add", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ username: uname, password: pass, role: r })
  });

  const data = await safeJson(res);

  if(res.ok) {
    alert("User created successfully");
    document.getElementById('addUserModal').classList.remove('active');
    fetchUsers();
  } else {
    alert(data.message || data.error || data.raw || "Failed to create user");
  }
}

async function toggleUserStatus(id) {
  const res = await fetch("/api/users/" + id + "/toggle-status", {
    method: "PUT",
    headers: { "Authorization": "Bearer " + token }
  });

  const data = await safeJson(res);

  if(res.ok) { alert(data.message); fetchUsers(); }
  else alert(data.message || data.error || data.raw || "Action failed");
}

async function deleteUser(id) {
  if (!confirm("Archive this user? (They can be restored later)")) return;

  const res = await fetch("/api/users/" + id, {
    method: "DELETE",
    headers: { "Authorization": "Bearer " + token }
  });

  const data = await safeJson(res);

  if (!res.ok) { alert(data.message || data.error || data.raw || "Delete failed"); return; }

  alert("User archived (soft-deleted)");
  fetchUsers();
}

async function restoreUser(id) {
  const res = await fetch("/api/users/" + id + "/restore", {
    method: "PUT",
    headers: { "Authorization": "Bearer " + token }
  });

  const data = await safeJson(res);

  if (res.ok) { alert(data.message || "User restored!"); fetchUsers(); }
  else { alert(data.message || data.error || data.raw || "Restore failed"); }
}


function editUser(id) {
  const usernameEl = document.getElementById("username-" + id);
  const roleEl = document.getElementById("role-" + id);
  const btn = document.getElementById("btn-update-" + id);

  if (!usernameEl || !roleEl || !btn) return;

  // Enable editing
  usernameEl.disabled = false;
  roleEl.disabled = false;

  // Store originals so we can cancel/compare
  usernameEl.dataset.original = usernameEl.value;
  roleEl.dataset.original = roleEl.value;

  // Switch button to Save
  btn.textContent = "Save";
  btn.onclick = () => saveUser(id);

  // Optional: focus
  usernameEl.focus();
}

async function saveUser(id) {
  const usernameEl = document.getElementById("username-" + id);
  const roleEl = document.getElementById("role-" + id);
  const btn = document.getElementById("btn-update-" + id);

  const newUsername = usernameEl.value.trim();
  const newRole = roleEl.value;

  const originalUsername = usernameEl.dataset.original || "";
  const originalRole = roleEl.dataset.original || "";

  // If nothing changed, just lock again
  if (newUsername === originalUsername && newRole === originalRole) {
    usernameEl.disabled = true;
    roleEl.disabled = true;
    btn.textContent = "Update";
    btn.onclick = () => editUser(id);
    alert("No changes made.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Saving...";

  const res = await fetch("/api/users/" + id, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ username: newUsername, role: newRole })
  });

  const data = await safeJson(res);

  if (!res.ok) {
    btn.disabled = false;
    btn.textContent = "Save";
    alert(data.message || data.error || data.raw || "Update failed");
    return;
  }

  alert("User updated successfully!");

  // Lock again and restore button
  usernameEl.disabled = true;
  roleEl.disabled = true;

  btn.disabled = false;
  btn.textContent = "Update";
  btn.onclick = () => editUser(id);

  fetchUsers();
}
