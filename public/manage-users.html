<!DOCTYPE html>
<html>
<head>
<title>Manage Users</title>
<style>
body { font-family: Arial; background:#f4f6ff; padding:40px; }
table { width:100%; border-collapse: collapse; background:white; }
th, td { padding:12px; border:1px solid #ddd; text-align:center; }
th { background:#2563EB; color:white; }
button { padding:6px 12px; border:none; background:red; color:white; cursor:pointer; }
</style>
</head>
<body>

<h1>Manage Users</h1>
<table>
  <thead>
    <tr>
      <th>Username</th>
      <th>Role</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="userTable"></tbody>
</table>

<script>
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

if (!token || role !== "ADMIN") {
  alert("Access denied");
  window.location.href = "/login.html";
}

async function fetchUsers() {
  try {
    const res = await fetch("/api/users", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    const data = await res.json();

    console.log("STATUS:", res.status);
    console.log("RESPONSE:", data);

    if (!res.ok) {
      alert(data.message || "Failed to fetch users");
      return;
    }

    const table = document.getElementById("userTable");
    table.innerHTML = "";

    if (!Array.isArray(data)) {
      alert("Users data is not an array!");
      return;
    }

    data.forEach(user => {
      table.innerHTML += `
        <tr>
          <td>${user.username}</td>
          <td>${user.role}</td>
          <td>OK</td>
        </tr>
      `;
    });

  } catch (error) {
    console.error("FETCH ERROR:", error);
    alert("Something crashed while fetching users.");
  }
}



async function deleteUser(id) {
  if (!confirm("Delete this user?")) return;

  const res = await fetch("/api/users/" + id, {
    method: "DELETE",
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  if (!res.ok) {
    const data = await res.json();
    alert(data.message || "Delete failed");
    return;
  }

  alert("User deleted successfully");
  fetchUsers();
}




async function updateUser(id) {
  const newUsername = document.getElementById("username-" + id).value;
  const newRole = document.getElementById("role-" + id).value;

  const res = await fetch("/api/users/" + id, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
      username: newUsername,
      role: newRole
    })
  });
  if (!res.ok) {
    const data = await res.json();
    alert(data.message || "Update failed");
    return;
  }

  alert("User updated successfully");
  fetchUsers();
}

</script>

</body>
</html>
