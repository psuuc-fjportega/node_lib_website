<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Urdaneta City Library</title>
<link rel="stylesheet" href="/library.css">
</head>
<body>

<div class="lib-auth-page">
  <!-- Left Panel -->
  <div class="lib-auth-panel">
    <div class="auth-icon">📚</div>
    <div class="auth-quote">"The only thing that you absolutely have to know, is the location of the library."</div>
    <div class="auth-quote-author">— Albert Einstein</div>
  </div>

  <!-- Right Panel — Form -->
  <div class="lib-auth-form">
    <div class="lib-auth-box">
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Sign in to access the library system</p>

      <form id="loginForm">
        <div class="lib-form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="lib-input" placeholder="Enter your username" required>
        </div>
        <div class="lib-form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="lib-input" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="lib-btn lib-btn-primary" style="width:100%;margin-top:0.5rem;">Sign In</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/register">Register here</a></p>
        <p style="margin-top:0.5rem;"><a href="/">← Back to Home</a></p>
      </div>
    </div>
  </div>
</div>

<script>
const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = loginForm.username.value;
  const password = loginForm.password.value;

  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.removeItem("token");
      localStorage.removeItem("role");
      localStorage.removeItem("username");

      localStorage.setItem("token", data.token);
      localStorage.setItem("role", data.role);
      localStorage.setItem("username", username);

      alert("Login successful!");

      if (data.role === "LIBRARIAN") window.location.href = "/librarian.html";
      else if (data.role === "ADMIN") window.location.href = "/admin.html";
      else window.location.href = "/member.html";
    } else {
      alert(data.message || "Login failed");
    }
  } catch (err) {
    console.error(err);
    alert("Something went wrong.");
  }
});
</script>

</body>
</html>
