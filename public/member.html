<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Dashboard</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: #fff;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 2rem;
    }
    h1 { margin-bottom: 0.5rem; }
    .btn {
      padding: 0.6rem 1.2rem;
      margin: 0.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-logout { background-color: #ff4d6d; color: #fff; }
    .btn-borrow { background-color: #ffd700; color: #000; }
    main { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
    .card {
      background: rgba(255,255,255,0.1);
      padding: 2rem;
      border-radius: 12px;
      min-width: 250px;
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <header>
    <h1>Welcome, Member!</h1>
    <p>Manage your books and borrow history here.</p>
    <button class="btn btn-logout" id="logoutBtn">Logout</button>
  </header>

  <main>
    <div class="card">
      <h2>Browse Books</h2>
      <p>See available books in the library.</p>
      <button class="btn btn-borrow" onclick="window.location.href='/books'">Go</button>
    </div>
    <div class="card">
      <h2>My Borrows</h2>
      <p>Check your borrowed books and due dates.</p>
      <button class="btn btn-borrow" onclick="window.location.href='/borrows/my'">Go</button>
    </div>
  </main>

  <script>
    // Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "/login.html";
    });

    // Protect the page
    const token = localStorage.getItem("token");
    if (!token) {
      alert("You must log in first!");
      window.location.href = "/login.html";
    }
  </script>
</body>
</html>
