<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Library System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; font-family:'Roboto', sans-serif; }
body { background:#F0F4FF; display:flex; justify-content:center; align-items:center; min-height:100vh; }

.form-container {
  background:white;
  padding:50px;
  border-radius:25px;
  box-shadow:0 25px 60px rgba(0,0,0,0.1);
  width:100%; max-width:400px;
  text-align:center;
}
h1 { color:#2563EB; margin-bottom:25px; }
label { display:block; margin:12px 0 6px; font-weight:bold; text-align:left; color:#1E3A8A; }
input, select { width:100%; padding:14px; margin-bottom:15px; border-radius:12px; border:1px solid #ccc; }
.btn-primary {
  width:100%;
  padding:15px;
  border-radius:50px;
  border:none;
  background:#F97316;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
.btn-primary:hover { background:#FFB366; color:#111827; }
a { color:#2563EB; text-decoration:none; }
a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="form-container">
    <h1>Register</h1>
    <form id="registerForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <label for="role">Role</label>
      <select id="role" name="role" required>
        <option value="MEMBER" selected>Member</option>
        <option value="LIBRARIAN">Librarian</option>
        <option value="ADMIN">Admin</option>
      </select>

      <div id="secretCodeContainer" style="display:none;">
        <label for="secretCode">Secret Code</label>
        <input type="text" id="secretCode" name="secretCode">
      </div>

      <button type="submit" class="btn-primary">Register</button>
    </form>
    <p>Already have an account? <a href="/login.html">Login here</a></p>
    <p><a href="/">Back to Home</a></p>
  </div>

<script>
const roleSelect = document.getElementById("role");
const secretContainer = document.getElementById("secretCodeContainer");

roleSelect.addEventListener("change", () => {
  if (roleSelect.value === "ADMIN" || roleSelect.value === "LIBRARIAN") {
    secretContainer.style.display = "block";
  } else {
    secretContainer.style.display = "none";
  }
});

const registerForm = document.getElementById("registerForm");

registerForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = registerForm.username.value;
  const password = registerForm.password.value;
  const role = registerForm.role.value;
  const secretCode = registerForm.secretCode.value;

  try {
    const res = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, role, secretCode })
    });

    const data = await res.json();

    if (res.ok) {
      alert("Registration successful! You can now login.");
      window.location.href = "/login.html";
    } else {
      alert(data.message || data.error);
    }
  } catch (err) {
    alert("Something went wrong. Try again.");
    console.error(err);
  }
});
</script>

</body>
</html>
