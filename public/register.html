<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Urdaneta City Library</title>
<link rel="stylesheet" href="/library.css">
</head>
<body>

<div class="lib-auth-page">
  <!-- Left Panel -->
  <div class="lib-auth-panel">
    <div class="auth-icon">📖</div>
    <div class="auth-quote">"I have always imagined that Paradise will be a kind of library."</div>
    <div class="auth-quote-author">— Jorge Luis Borges</div>
  </div>

  <!-- Right Panel — Form -->
  <div class="lib-auth-form">
    <div class="lib-auth-box">
      <h1>Create Account</h1>
      <p class="auth-subtitle">Join the Urdaneta City Library community</p>

      <form id="registerForm">
        <div class="lib-form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="lib-input" placeholder="Choose a username" required>
        </div>
        <div class="lib-form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="lib-input" placeholder="Create a password" required>
        </div>
        <div class="lib-form-group">
          <label for="role">Role</label>
          <select id="role" name="role" class="lib-input" required>
            <option value="MEMBER" selected>Member</option>
            <option value="LIBRARIAN">Librarian</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>

        <div id="secretCodeContainer" style="display:none;">
          <div class="lib-form-group">
            <label for="secretCode">Secret Code</label>
            <input type="text" id="secretCode" name="secretCode" class="lib-input" placeholder="Enter secret code">
          </div>
        </div>

        <button type="submit" class="lib-btn lib-btn-primary" style="width:100%;margin-top:0.5rem;">Create Account</button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="/login.html">Login here</a></p>
        <p style="margin-top:0.5rem;"><a href="/">← Back to Home</a></p>
      </div>
    </div>
  </div>
</div>

<script>
const roleSelect = document.getElementById("role");
const secretContainer = document.getElementById("secretCodeContainer");

roleSelect.addEventListener("change", () => {
  secretContainer.style.display = (roleSelect.value === "ADMIN" || roleSelect.value === "LIBRARIAN") ? "block" : "none";
});

const registerForm = document.getElementById("registerForm");

registerForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = registerForm.username.value;
  const password = registerForm.password.value;
  const role = registerForm.role.value;
  const secretCode = registerForm.secretCode.value;

  try {
    const res = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, role, secretCode })
    });

    const data = await res.json();

    if (res.ok) {
      alert("Registration successful! You can now login.");
      window.location.href = "/login.html";
    } else {
      alert(data.message || data.error);
    }
  } catch (err) {
    alert("Something went wrong. Try again.");
    console.error(err);
  }
});
</script>

</body>
</html>
