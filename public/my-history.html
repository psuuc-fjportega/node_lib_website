<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Borrowing History — Urdaneta City Library</title>
<link rel="stylesheet" href="/library.css">
</head>
<body>

<nav class="lib-navbar">
  <a href="/" class="logo">📚 Urdaneta City Library</a>
  <div class="nav-links">
    <a href="/member.html">Dashboard</a>
    <span class="user-info" id="userDisplay"></span>
    <a href="#" id="logoutBtn">Logout</a>
  </div>
</nav>

<div class="lib-page">
  <div class="lib-page-header">
    <h1>📜 My Borrowing History</h1>
    <div class="breadcrumb"><a href="/member.html">Member Dashboard</a> → My History</div>
  </div>

  <div class="lib-tabs">
    <div class="lib-tab active" onclick="showTab('active', this)">Active Loans</div>
    <div class="lib-tab" onclick="showTab('history', this)">History</div>
    <div class="lib-tab" onclick="showTab('reservations', this)">Reservations</div>
  </div>

  <div class="lib-table-wrapper">
    <table class="lib-table">
      <thead>
        <tr id="tableHeaders">
          <th>Book</th>
          <th>Due Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="loansBody"></tbody>
    </table>
  </div>
</div>

<footer class="lib-footer">
  <p>&copy; 2026 Urdaneta City Library</p>
</footer>

<script>
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");
const username = localStorage.getItem("username");

if (!token) window.location.href = "/login.html";
if (role && role !== "MEMBER") {
  alert("Members only.");
  window.location.href = "/login.html";
}

document.getElementById("userDisplay").textContent = username ? `👤 ${username}` : "";

document.getElementById("logoutBtn").addEventListener("click", (e) => {
  e.preventDefault();
  localStorage.removeItem("token");
  localStorage.removeItem("role");
  localStorage.removeItem("username");
  window.location.href = "/login.html";
});

let allLoans = [];
let myReservations = [];

async function safeJson(res) {
  const raw = await res.text();
  try { return raw ? JSON.parse(raw) : {}; } catch { return { raw }; }
}

// Try both possible API base paths so you don't get stuck if server mounts differently
async function fetchJSONWithFallback(paths, options) {
  let lastErr = null;
  for (const p of paths) {
    try {
      const res = await fetch(p, options);
      if (!res.ok) {
        const data = await safeJson(res);
        throw new Error(`${p} -> ${res.status} :: ${data.message || data.error || data.raw || "Error"}`);
      }
      return await res.json();
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error("All API paths failed");
}

async function fetchMyData() {
  try {
    const headers = { "Authorization": "Bearer " + token };

    allLoans = await fetchJSONWithFallback(
      ["/api/borrows/my", "/borrow/my"],
      { headers }
    );

    myReservations = await fetchJSONWithFallback(
      ["/api/reservations/my", "/reservation/my", "/reservations/my"],
      { headers }
    );

    const firstTab = document.querySelector(".lib-tab.active") || document.querySelector(".lib-tab");
    showTab("active", firstTab);
  } catch (err) {
    console.error("Error fetching data:", err);
    const tbody = document.getElementById("loansBody");
    tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;color:var(--text-muted);padding:2rem;'>Failed to load data. Check console + API route mount.</td></tr>";
  }
}

function setActiveTab(tabEl) {
  document.querySelectorAll(".lib-tab").forEach(t => t.classList.remove("active"));
  if (tabEl) tabEl.classList.add("active");
}

function loanStatusBadge(loan, isOverdue) {
  const s = (loan.status || "").toUpperCase();

  if (s === "PENDING") return '<span class="lib-badge lib-badge-warning">Pending Approval</span>';
  if (s === "REJECTED") return '<span class="lib-badge lib-badge-danger">Rejected</span>';
  if (loan.returned || s === "RETURNED") return '<span class="lib-badge lib-badge-neutral">Returned</span>';
  if (s === "LOST") return '<span class="lib-badge lib-badge-danger">Lost</span>';
  if (s === "DAMAGED") return '<span class="lib-badge lib-badge-warning">Damaged</span>';
  if (isOverdue) return '<span class="lib-badge lib-badge-danger">Overdue</span>';
  if (s === "BORROWED") return '<span class="lib-badge lib-badge-success">Borrowed</span>';

  return `<span class="lib-badge lib-badge-neutral">${loan.status || "Unknown"}</span>`;
}

function showTab(type, tabEl) {
  setActiveTab(tabEl);

  const tbody = document.getElementById("loansBody");
  const thead = document.getElementById("tableHeaders");
  tbody.innerHTML = "";

  if (type === "reservations") {
    thead.innerHTML = `<th>Book</th><th>Requested On</th><th>Status</th><th>Actions</th>`;

    if (!myReservations || myReservations.length === 0) {
      tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;color:var(--text-muted);padding:2rem;'>No reservations found.</td></tr>";
      return;
    }

    myReservations.forEach(r => {
      const date = r.requestDate ? new Date(r.requestDate).toLocaleDateString() : "—";
      let statusBadge = `<span class="lib-badge lib-badge-neutral">${r.status || "UNKNOWN"}</span>`;
      if (r.status === "PENDING") statusBadge = '<span class="lib-badge lib-badge-warning">Pending</span>';
      if (r.status === "FULFILLED") statusBadge = '<span class="lib-badge lib-badge-success">Fulfilled</span>';

      tbody.innerHTML += `
        <tr>
          <td><strong>${r.book?.title || "Unknown"}</strong></td>
          <td>${date}</td>
          <td>${statusBadge}</td>
          <td>
            ${r.status === "PENDING"
              ? `<button class="lib-btn lib-btn-danger lib-btn-sm" onclick="cancelReservation('${r._id}')">Cancel</button>`
              : "—"}
          </td>
        </tr>
      `;
    });
    return;
  }

  // Loans (Active/History)
  thead.innerHTML = `<th>Book</th><th>Due Date</th><th>Status</th><th>Actions</th>`;

  const loansArr = Array.isArray(allLoans) ? allLoans : [];

  // ✅ Define "active" & "history" for approval flow:
  // Active tab: PENDING + BORROWED (not returned, not rejected)
  // History tab: RETURNED + REJECTED (+ LOST/DAMAGED if you want)
  const filteredLoans = loansArr.filter(loan => {
    const s = (loan.status || "").toUpperCase();

    if (type === "active") {
      return (s === "PENDING" || s === "BORROWED") && !loan.returned;
    }

    // history
    return loan.returned || s === "RETURNED" || s === "REJECTED" || s === "LOST" || s === "DAMAGED";
  });

  if (filteredLoans.length === 0) {
    tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;color:var(--text-muted);padding:2rem;'>No records found.</td></tr>";
    return;
  }

  // Sort: pending first, then borrowed, then returned/rejected
  filteredLoans.sort((a, b) => {
    const score = (x) => {
      const s = (x.status || "").toUpperCase();
      if (s === "PENDING") return 0;
      if (s === "BORROWED") return 1;
      if (s === "RETURNED" || x.returned) return 2;
      if (s === "REJECTED") return 3;
      return 4;
    };
    return score(a) - score(b);
  });

  filteredLoans.forEach(loan => {
    const dueDate = loan.dueDate ? new Date(loan.dueDate) : null;
    const isOverdue = dueDate ? (new Date() > dueDate && !loan.returned && (loan.status || "").toUpperCase() === "BORROWED") : false;

    const statusBadge = loanStatusBadge(loan, isOverdue);

    const dueText = dueDate ? dueDate.toLocaleDateString() : "—";
    const s = (loan.status || "").toUpperCase();

    // Renew only if BORROWED and not returned
    const canRenew = (s === "BORROWED") && !loan.returned;

    tbody.innerHTML += `
      <tr>
        <td><strong>${loan.book?.title || "Unknown book"}</strong></td>
        <td class="${isOverdue ? "overdue" : ""}">
          ${dueText}
          ${isOverdue ? " (OVERDUE)" : ""}
        </td>
        <td>${statusBadge}</td>
        <td>
          ${canRenew
            ? `<button class="lib-btn lib-btn-warning lib-btn-sm" onclick="renewBook('${loan._id}')">Renew</button>`
            : "—"}
        </td>
      </tr>
    `;
  });
}

async function renewBook(id) {
  try {
    await fetchJSONWithFallback(
      ["/api/borrows/renew/" + id, "/borrow/renew/" + id],
      {
        method: "PUT",
        headers: { "Authorization": "Bearer " + token }
      }
    );

    alert("Book renewed successfully!");
    await fetchMyData();
  } catch (e) {
    console.error(e);
    alert("Failed to renew. Check console.");
  }
}

async function cancelReservation(id) {
  if (!confirm("Cancel reservation?")) return;

  try {
    await fetchJSONWithFallback(
      ["/api/reservations/cancel/" + id, "/reservation/cancel/" + id, "/reservations/cancel/" + id],
      {
        method: "PUT",
        headers: { "Authorization": "Bearer " + token }
      }
    );

    alert("Reservation cancelled.");
    await fetchMyData();
  } catch (e) {
    console.error(e);
    alert("Failed to cancel reservation. Check console.");
  }
}

fetchMyData();
</script>

</body>
</html>
