<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Books — Urdaneta City Library</title>
<link rel="stylesheet" href="/library.css">
</head>
<body>

<nav class="lib-navbar">
  <a href="/" class="logo">📚 Urdaneta City Library</a>
  <div class="nav-links">
    <a href="/member.html">Dashboard</a>
    <span class="user-info" id="userDisplay"></span>
  </div>
</nav>

<div class="lib-page">
  <div class="lib-page-header">
    <h1>🔍 Browse Books</h1>
    <div class="breadcrumb"><a href="/member.html">Member Dashboard</a> → Browse Books</div>
  </div>

  <div class="lib-filters">
    <input type="text" id="searchInput" class="lib-input" placeholder="Search by title or author...">
    <select id="categorySelect" class="lib-input" style="max-width:180px;">
      <option value="">All Categories</option>
      <option value="Fiction">Fiction</option>
      <option value="Non-Fiction">Non-Fiction</option>
      <option value="Sci-Fi">Sci-Fi</option>
      <option value="History">History</option>
    </select>
    <select id="availabilitySelect" class="lib-input" style="max-width:180px;">
      <option value="">All Status</option>
      <option value="true">Available Only</option>
    </select>
    <button class="lib-btn lib-btn-primary" onclick="fetchBooks()">Search</button>
  </div>

  <div class="lib-book-grid" id="booksGrid">
    <p style="color:var(--text-light);">Loading books...</p>
  </div>
</div>

<footer class="lib-footer">
  <p>&copy; 2026 Urdaneta City Library</p>
</footer>

<script>
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");
const username = localStorage.getItem("username");
if (!token) window.location.href = "/login.html";

document.getElementById("userDisplay").textContent = username ? `👤 ${username} (${role})` : "";

let myBorrows = [];               // cached borrows for status display
let optimisticPending = new Set(); // bookIds we just requested (instant Pending UI)

async function safeJson(res) {
  const raw = await res.text();
  try { return raw ? JSON.parse(raw) : {}; } catch { return { raw }; }
}

function buildBorrowStatusMap(borrows) {
  // bookId -> "PENDING" | "BORROWED"
  // Priority: ACTIVE PENDING always wins
  const map = new Map();

  (borrows || []).forEach(b => {
    const bookId = b.book?._id || b.book;
    if (!bookId) return;

    const status = (b.status || "").toUpperCase();
    const returned = !!b.returned;

    // ignore closed records
    if (returned || status === "RETURNED" || status === "REJECTED") return;

    if (status === "PENDING") {
      map.set(bookId, "PENDING");
      return;
    }

    if (!map.has(bookId) && status === "BORROWED") {
      map.set(bookId, "BORROWED");
    }
  });

  return map;
}

async function fetchMyBorrows() {
  // ✅ cache bust + no-store to prevent 304 stale response
  const res = await fetch("/api/borrows/my?t=" + Date.now(), {
    headers: {
      "Authorization": "Bearer " + token,
      "Cache-Control": "no-cache"
    },
    cache: "no-store"
  });

  const data = await safeJson(res);
  if (!res.ok) {
    console.log("Failed to load my borrows:", res.status, data);
    myBorrows = [];
    return;
  }

  myBorrows = Array.isArray(data) ? data : [];
}

async function fetchBooks() {
  const search = document.getElementById("searchInput").value;
  const category = document.getElementById("categorySelect").value;
  const availability = document.getElementById("availabilitySelect").value;

  let query = `?search=${encodeURIComponent(search)}&category=${encodeURIComponent(category)}&availability=${availability}`;

  // ✅ always fetch fresh borrows first
  await fetchMyBorrows();
  const statusMap = buildBorrowStatusMap(myBorrows);

  // ✅ cache bust + no-store for books too
  const res = await fetch("/api/books" + query + "&t=" + Date.now(), {
    headers: {
      "Authorization": "Bearer " + token,
      "Cache-Control": "no-cache"
    },
    cache: "no-store"
  });

  const books = await safeJson(res);

  const grid = document.getElementById("booksGrid");
  grid.innerHTML = "";

  if (!res.ok) {
    grid.innerHTML = `<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:2rem;">
      Failed to load books (${res.status}).
    </p>`;
    console.log("Books error:", res.status, books);
    return;
  }

  if (!Array.isArray(books) || books.length === 0) {
    grid.innerHTML = "<p style='color:var(--text-muted);grid-column:1/-1;text-align:center;padding:2rem;'>No books found.</p>";
    return;
  }

  books.forEach(book => {
    const isAvailable = book.availableCopies > 0;

    // ✅ If we *just requested* this book, force Pending immediately (optimistic UI)
    const forcedPending = optimisticPending.has(book._id);

    const myStatus = statusMap.get(book._id);
    const isPending = forcedPending || myStatus === "PENDING";
    const isBorrowed = !isPending && myStatus === "BORROWED";

    let actionButton = "";

    if (isBorrowed) {
      actionButton = `<button class="lib-btn lib-btn-success lib-btn-sm" disabled style="opacity:0.75;cursor:not-allowed;">Borrowed</button>`;
    } else if (isPending) {
      actionButton = `<button class="lib-btn lib-btn-warning lib-btn-sm" disabled style="opacity:0.75;cursor:not-allowed;">Pending</button>`;
    } else if (isAvailable) {
      actionButton = `<button class="lib-btn lib-btn-primary lib-btn-sm" onclick="borrowBook('${book._id}')">Borrow</button>`;
    } else {
      actionButton = `<button class="lib-btn lib-btn-warning lib-btn-sm" onclick="reserveBook('${book._id}')">Reserve</button>`;
    }

    grid.innerHTML += `
      <div class="lib-book-card">
        <div class="book-icon">📖</div>
        <h3>${book.title}</h3>
        <p class="book-author">${book.author}</p>
        <p class="book-category">${book.category || 'General'}</p>
        <p class="book-status ${isAvailable ? 'available' : 'unavailable'}">
          ${isAvailable ? '✓ Available' : '✗ Out of Stock'} (${book.availableCopies}/${book.totalCopies})
        </p>
        ${actionButton}
      </div>
    `;
  });
}

async function borrowBook(bookId) {
  if (!confirm("Send borrow request for approval?")) return;

  // ✅ instant UI change to Pending
  optimisticPending.add(bookId);
  fetchBooks();

  try {
    const res = await fetch("/api/borrows", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ bookId })
    });

    const data = await safeJson(res);

    if (!res.ok) {
      optimisticPending.delete(bookId); // rollback optimistic pending
      alert(`Request failed (${res.status}): ${data.message || data.error || data.raw || "Unknown error"}`);
      console.log("Borrow request failed:", res.status, data);
      fetchBooks();
      return;
    }

    alert("Borrow request sent! Please wait for librarian approval.");

    // refresh fresh state from server
    await fetchBooks();
  } catch (err) {
    optimisticPending.delete(bookId);
    console.error(err);
    alert("Request failed: " + err.message);
    fetchBooks();
  }
}

async function reserveBook(bookId) {
  if(!confirm("Reserve this book?")) return;

  const res = await fetch("/api/reservations", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ bookId })
  });

  const data = await safeJson(res);
  if(res.ok) {
    alert("Reservation placed successfully!");
  } else {
    alert(data.message || data.error || data.raw || "Failed to reserve");
  }
}

fetchBooks();
</script>

</body>
</html>
