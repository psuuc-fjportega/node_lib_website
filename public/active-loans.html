<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Loans — Urdaneta City Library</title>
<link rel="stylesheet" href="/library.css">
</head>
<body>

<nav class="lib-navbar">
  <a href="/" class="logo">📚 Urdaneta City Library</a>
  <div class="nav-links">
    <a href="/librarian.html">Dashboard</a>
    <span class="user-info" id="userDisplay"></span>
  </div>
</nav>

<div class="lib-page">
  <div class="lib-page-header">
    <h1>📑 Active Loans</h1>
    <div class="breadcrumb"><a href="/librarian.html">Librarian Dashboard</a> → Active Loans</div>
  </div>

  <div class="lib-table-wrapper">
    <table class="lib-table">
      <thead>
        <tr>
          <th>Book</th>
          <th>Borrower</th>
          <th>Due Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="loansTable"></tbody>
    </table>
  </div>
</div>

<footer class="lib-footer">
  <p>&copy; 2026 Urdaneta City Library</p>
</footer>

<script>
const token = localStorage.getItem("token");
if (!token) window.location.href = "/login.html";

const username = localStorage.getItem("username");
document.getElementById("userDisplay").textContent = username ? `👤 ${username}` : "";

async function fetchLoans() {
    const res = await fetch("/api/borrows", {
        headers: { "Authorization": "Bearer " + token }
    });
    const loans = await res.json();
    const tbody = document.getElementById("loansTable");
    tbody.innerHTML = "";
    
    loans.forEach(loan => {
        if (loan.status === 'RETURNED') return;

        const dueDate = new Date(loan.dueDate);
        const isOverdue = new Date() > dueDate && loan.status === 'BORROWED';
        
        let statusBadge = '';
        if (loan.status === 'BORROWED' && !isOverdue) statusBadge = '<span class="lib-badge lib-badge-success">Borrowed</span>';
        else if (isOverdue) statusBadge = '<span class="lib-badge lib-badge-danger">Overdue</span>';
        else if (loan.status === 'LOST') statusBadge = '<span class="lib-badge lib-badge-danger">Lost</span>';
        else if (loan.status === 'DAMAGED') statusBadge = '<span class="lib-badge lib-badge-warning">Damaged</span>';
        else statusBadge = `<span class="lib-badge lib-badge-neutral">${loan.status}</span>`;

        tbody.innerHTML += `
            <tr>
                <td><strong>${loan.book ? loan.book.title : 'Unknown'}</strong></td>
                <td>${loan.user ? loan.user.username : 'Unknown'}</td>
                <td class="${isOverdue ? 'overdue' : ''}">
                    ${dueDate.toLocaleDateString()}
                    ${isOverdue ? ' (OVERDUE)' : ''}
                </td>
                <td>${statusBadge}</td>
                <td>
                    <button class="lib-btn lib-btn-success lib-btn-sm" onclick="returnBook('${loan._id}')">Return</button>
                    <button class="lib-btn lib-btn-warning lib-btn-sm" onclick="renewBook('${loan._id}')">Renew</button>
                    <button class="lib-btn lib-btn-sm" style="background:#666;color:#fff;" onclick="markStatus('${loan._id}', 'LOST')">Lost</button>
                    <button class="lib-btn lib-btn-sm" style="background:#333;color:#fff;" onclick="markStatus('${loan._id}', 'DAMAGED')">Damaged</button>
                </td>
            </tr>
        `;
    });

    if(!tbody.innerHTML) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:2rem;">No active loans found.</td></tr>';
    }
}

async function returnBook(id) {
    if(!confirm("Confirm return?")) return;
    const res = await fetch("/api/borrows/return/" + id, {
        method: "PUT",
        headers: { "Authorization": "Bearer " + token }
    });
    if(res.ok) fetchLoans();
    else alert("Failed to return");
}

async function renewBook(id) {
    const res = await fetch("/api/borrows/renew/" + id, {
        method: "PUT",
        headers: { "Authorization": "Bearer " + token }
    });
    if(res.ok) { alert("Book renewed!"); fetchLoans(); }
    else { const data = await res.json(); alert(data.message || "Failed to renew"); }
}

async function markStatus(id, status) {
    if(!confirm(`Mark this book as ${status}?`)) return;
    const res = await fetch("/api/borrows/status/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ status })
    });
    if(res.ok) fetchLoans();
    else alert("Failed to update status");
}

fetchLoans();
</script>

</body>
</html>
